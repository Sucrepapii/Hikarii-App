name: CI Pipeline

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  VITE_API_URL: "http://localhost:5005/api"
  VITE_SUPABASE_URL: "https://placeholder-project.supabase.co"
  VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder"
  JWT_SECRET: "ci-test-jwt-secret-must-be-32-chars-long"
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test?schema=public"

jobs:
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src/components/landing/ server/src/controllers/admin.controller.ts server/src/services/admin.service.ts server/src/config/logger.ts

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript Compiler Check
        run: npx tsc --noEmit

  test:
    name: Run Vitest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Unit & Component Tests with Coverage
        run: npx vitest run --coverage

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Application Bundle
        run: npm run build
